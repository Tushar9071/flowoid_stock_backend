name: Build and Deploy Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/tushar9071/flowoid-backend
  STACK_NAME: flowoid
  STACK_FILE: /opt/flowoid/docker-stack.yml

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          no-cache: true 

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Docker stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"
            OVERRIDE_FILE="/tmp/flowoid-backend-${{ github.sha }}.yml"

            docker pull "$IMAGE"

            docker run --rm \
              --network host \
              --env-file /opt/flowoid/.env.backend \
              "$IMAGE" \
              pnpm db:migrate

            cat > "$OVERRIDE_FILE" << 'EOF'
services:
  backend:
    image: IMAGE_PLACEHOLDER
EOF
            sed -i "s|IMAGE_PLACEHOLDER|$IMAGE|g" "$OVERRIDE_FILE"

            docker stack deploy \
              --with-registry-auth \
              -c "${{ env.STACK_FILE }}" \
              -c "$OVERRIDE_FILE" \
              "${{ env.STACK_NAME }}"

            rm -f "$OVERRIDE_FILE"

            echo "Deployed $IMAGE to stack ${{ env.STACK_NAME }}"
 

